# ICONIX project configuration
# Each project drops this file at its root to parameterize the agent kit.

# Kit version that installed / last upgraded this project.
# Set automatically by iconix-init (fresh install) and /iconix-upgrade.
# Used by iconix-upgrade for version detection; do not edit by hand.
kit_version: "0.9.9"

project:
  name: "YourProject"
  prefix: "PRJ"           # ID prefix, e.g., RGS-UC-017

stack:
  language: "csharp"       # csharp | java | python | typescript | go
  test_framework: "xunit"  # xunit | nunit | junit | pytest | jest
  # Controls BDD-DRAFT feature file generation in Migration Phase 5c (Steps 4–6).
  #   true  — Migration agent generates BDD-DRAFT-*.feature files in addition to the
  #            domain glossary (migration/domain-glossary.md).
  #   false — Migration agent still runs schema analysis (Tracks A/B/C) and produces
  #            the domain glossary (Steps 1–3); only BDD-DRAFT file generation is skipped.
  #            Set false when your team is not yet adopting BDD but still wants the
  #            domain vocabulary output.
  bdd: true
  bdd_framework: "specflow" # specflow | cucumber | behave | jasmine

diagrams:
  format: "plantuml"       # plantuml | mermaid
  output_dir: "docs/iconix"

architecture:
  # Path to your system architecture document (C4-flavoured .md or .pdf).
  # Read by the Architect agent when mapping UCs to containers and raising ADRs.
  # If the file doesn't exist yet, copy templates/system-architecture-template.md
  # to this path and fill it in before running the Architect agent.
  canonical_doc: "docs/architecture/system-architecture.md"
  containers:
    # List the named containers in your architecture.
    # The Architect agent will map UCs to these.
    # Optional: add a stack: sub-key to override the top-level stack for that container.
    # Developer and Tester agents resolve language/test_framework as:
    #   container stack.language → top-level stack.language (fallback)
    #
    # ── Multi-repo fields (optional — omit for single-repo projects) ─────────
    # When path: is set, this container lives in a separate git repository
    # cloned locally. All agents resolve source at <path>/<src_dir> and tests
    # at <path>/<test_dir>. Without path:, the single-repo fallback applies:
    #   source → ./src/<ContainerName>/
    #   tests  → ./tests/<ContainerName>.Tests/
    #
    # src_dir: accepts nested paths — use this when multiple containers share
    # one git repo (mixed topology). Containers with the same path: value are
    # treated as one git repo: one branch and one PR for both.
    #
    # Mixed topology example (Backend + WebAPI in the same repo):
    #   - name: "Backend"
    #     path: "../shared-platform"
    #     src_dir: "src/Backend"        # ← nested: <path>/src/Backend/
    #     git_url: "https://github.com/org/shared-platform"
    #   - name: "WebAPI"
    #     path: "../shared-platform"    # ← same path: = same git repo
    #     src_dir: "src/WebAPI"         # ← nested: <path>/src/WebAPI/
    # ─────────────────────────────────────────────────────────────────────────
    - name: "Backend"
      # path: "../my-backend-service"      # local clone path (multi-repo only)
      # git_url: "https://github.com/org/backend"  # for /iconix-pr PR creation
      # src_dir: "src"                     # source subdir within path (default: "src")
      #                                    # use nested path e.g. "src/Backend" for
      #                                    # mixed topology (multiple containers, one repo)
      # test_dir: "tests"                  # test subdir within path (default: "tests")
      # base_branch: "develop"             # base branch in this repo for PRs and sync
      #                                    # (default: git.default_branch)
      # graph_path: "../my-backend-service/graphify-out/graph.json"
      #                                    # per-container Graphify graph (multi-repo + graph-assisted
      #                                    # mode). Omit to use the global knowledge_graph.graph_path
      #                                    # scoped to this container's source root. If neither exists,
      #                                    # the migration agent falls back to code-walking for this
      #                                    # container only.
      # reviewers: []                      # PR reviewers e.g. ["@alice", "@team-backend"]
    - name: "WebAPI"
      # path: "../my-webapi-service"
      # git_url: "https://github.com/org/webapi"
    - name: "Frontend"
      stack:                    # optional — overrides top-level stack for this container only
        language: "typescript"
        test_framework: "jest"
      # path: "../my-frontend-app"
      # git_url: "https://github.com/org/frontend"
    - name: "Database"

# Dependency sources available locally for the migration agent (optional, v1.0.7+)
#
# Use this when dependency source code lives on the same machine but is NOT
# reachable via a ProjectReference / workspace link in the container's manifest:
#
#   1. In-house packages (NuGet, npm, pip, Maven, etc.) — your team owns the source
#      and has it cloned locally. The container's manifest only sees a package name +
#      version; the agent cannot auto-detect the source path.
#
#   2. Plugins — loaded at runtime via reflection / MEF / plugin-framework. The main
#      container has NO compile-time reference to the plugin implementation; only to a
#      contract interface. Without this entry the agent cannot trace the plugin's
#      outbound boundaries.
#
# Project references declared in a manifest (e.g. <ProjectReference> in .csproj,
# workspace entries in package.json, go.work use directives) are auto-detected in
# Step 0b-A and do NOT need an entry here.
#
# role values:
#   domain         — entities, value objects, domain services
#   infrastructure — repositories, adapters, external service clients
#   utility        — helpers, extensions, cross-cutting concerns
#   contracts      — interfaces and DTOs that plugins implement (plugin contracts)
#   plugin         — runtime-loaded plugin implementations
#
# containers: (optional per entry) — list of container names this source applies to.
#   Omit to apply to ALL containers. Use this to scope plugins or packages that are
#   only relevant to one container so the agent does not pollute others' registries.
#   Package entries without containers: are still filtered at runtime by whether the
#   package name appears in that container's manifest — but explicit scoping is cleaner.
#
# dependency_sources:
#   - name: "Acme.Domain"
#     path: "../acme-domain/src"
#     role: domain
#     # containers: ["Backend", "WebAPI"]   # omit = all containers
#   - name: "Acme.Infrastructure"
#     path: "../acme-infra/src"
#     role: infrastructure
#     # containers: ["Backend"]
#   - name: "PluginContracts"
#     path: "../plugins/contracts/src"
#     role: contracts
#     # contracts are typically shared — omit containers: to apply everywhere
#   - name: "ReportingPlugin"
#     path: "../plugins/reporting/src"
#     role: plugin
#     containers: ["Backend"]              # plugin only loaded by Backend

nfr_catalog: "docs/nfr-catalog.md"

# Custom test families for your domain (e.g., gaming, finance, healthcare)
domain_test_families:
  # - "regulatory-audit"
  # - "transaction-idempotency"

milestones:
  require_traceability_pass: true
  require_rule_validation: true
  max_revisions_per_artifact: 3   # anti-analysis-paralysis guardrail

# Concurrent-touch detection at M2 (added v0.9.6)
# Surfaces class- and container-level conflicts between in-flight UCs
# before they become merge conflicts at Implementation.
concurrent_check:
  enabled: true
  block_on_high_conflict: false   # advisory by default; true to fail M2 PR builds on HIGH conflicts
  detect_boundaries: true         # check for same-named controllers across UCs
  detect_db_containers: true      # check for two UCs writing the same DB container

# Phase 9 implementation loop (added v0.9.8)
# Caps the Developer ↔ Tester ↔ Reviewer loop per UC. When the cap is hit,
# the Orchestrator escalates instead of continuing — a Type 1 problem that
# can't be fixed in N rounds is probably a Type 2 (design) problem.
phase9:
  enabled: true
  max_iterations_per_uc: 5         # consistent with milestones.max_revisions_per_artifact (3) but slightly higher because Phase 9 has more iteration types
  reviewer_required_for_merge: true   # Pre-merge drift check is mandatory; false = advisory only

# Metrics snapshot (added v0.9.7)
# Produces audit-friendly markdown + machine-readable JSON for downstream
# dashboards. Snapshot-based; reads current state from artifacts + git log.
# See docs/iconix/metrics-glossary.md for definitions and
# docs/iconix/templates/metrics-schema.json for the JSON schema.
metrics:
  enabled: true
  output_dir: "metrics"
  ci_snapshot: false              # generate snapshot on push to main / scheduled CI
  retention: 12                   # keep N most recent snapshot pairs; older are pruned
  git_history_window: "12 months" # how far back to scan for cycle-time computation

# Git integration (optional, used by iconix-git in v0.9.5+)
# See docs/iconix/templates/git-integration/ for the full reference.
git:
  provider: "generic"           # github | azure-devops | generic
  default_branch: "main"
  branch_strategy: "trunk"      # trunk | gitflow
  work_item_prefix: ""          # e.g. "AB#" (Azure Boards), "#" (GitHub Issues), or "" to disable
  pr_cli: "none"                # gh | az | none — must be on PATH if set
  impl_squash: false            # squash Implementation-phase PRs to one commit (true) or preserve history (false)

# Multi-repo: cross-container test directories in the meta-project repo (v1.0.0+)
# Only used when ≥1 container above has path: defined (multi-repo mode).
# System and acceptance tests that span multiple containers live here, not in
# any individual container repo.
# meta:
#   system_tests_dir: "tests/SystemTests"         # cross-container system tests
#   acceptance_tests_dir: "tests/AcceptanceTests"  # BDD step definitions for features/

# Business rule extraction — Phase 5d (optional, v1.0.32+)
# Scans validator classes, domain-layer guard clauses, specification/policy classes,
# and SQL triggers to produce migration/business-rules.md.
# Runs after Phase 5c (reads domain-glossary.md as primary input).
# Disabling skips Phase 5d only — domain glossary and BDD-DRAFTs are unaffected.
business_rules:
  enabled: true

# Knowledge graph integration (optional, used by iconix-migration in v0.3.0+)
# Enable when you have Graphify installed and have run `graphify .` on your repo.
# See docs/iconix/templates/graphify-setup.md for setup.
knowledge_graph:
  enabled: false                       # set to true after running graphify
  tool: "graphify"                     # only graphify is supported in v0.3.0
  graph_path: "graphify-out/graph.json"
  report_path: "graphify-out/GRAPH_REPORT.md"
  mcp_server: true                     # use MCP server for live queries
  min_confidence: 0.7                  # threshold for INFERRED edges
  max_age_warn_days: 7                 # warn if graph older than this
  max_age_fail_days: 30                # refuse to proceed if older than this
