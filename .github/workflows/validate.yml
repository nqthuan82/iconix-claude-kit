name: Validate ICONIX Kit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check agent file frontmatter
        run: |
          set -e
          fail=0
          for f in agents/*.md; do
            if ! head -1 "$f" | grep -q '^---$'; then
              echo "ERROR: $f is missing YAML frontmatter opening"
              fail=1
            fi
            if ! head -20 "$f" | grep -q '^name:'; then
              echo "ERROR: $f is missing 'name:' in frontmatter"
              fail=1
            fi
            if ! head -20 "$f" | grep -q '^description:'; then
              echo "ERROR: $f is missing 'description:' in frontmatter"
              fail=1
            fi
          done
          exit $fail

      - name: Check command file frontmatter
        run: |
          set -e
          fail=0
          for f in commands/*.md; do
            if ! head -1 "$f" | grep -q '^---$'; then
              echo "ERROR: $f is missing YAML frontmatter opening"
              fail=1
            fi
            if ! head -10 "$f" | grep -q '^description:'; then
              echo "ERROR: $f is missing 'description:' in frontmatter"
              fail=1
            fi
          done
          exit $fail

      - name: Ensure agent names are unique
        run: |
          names=$(grep -h '^name:' agents/*.md | sort)
          dupes=$(echo "$names" | uniq -d)
          if [ -n "$dupes" ]; then
            echo "ERROR: Duplicate agent names found:"
            echo "$dupes"
            exit 1
          fi

  validate-plantuml:
    # Catches PlantUML rendering bugs that previously slipped past prompt review
    # and only surfaced when a human opened the file in a previewer:
    #   - v0.9.13: bare <...> in arrow labels / unclosed <PREFIX> tags in notes
    #   - v0.9.15: "empty" diagram (only comments between @startuml/@enduml)
    # See CHANGELOG entries for v0.9.13 and v0.9.15.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PlantUML
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y plantuml

      - name: Validate PlantUML files (syntax + content)
        run: |
          set +e   # collect all failures, don't stop on first
          fail=0
          # Find every .puml in the repo (templates/, examples/, root, etc.)
          # Skip .git internals and anything in node_modules if present.
          files=$(find . -name '*.puml' -not -path './.git/*' -not -path './node_modules/*' | sort)

          if [ -z "$files" ]; then
            echo "No .puml files found — nothing to validate."
            exit 0
          fi

          echo "Validating $(echo "$files" | wc -l | tr -d ' ') .puml file(s)..."
          echo ""

          for f in $files; do
            echo "── $f"

            # 1. Syntax check via plantuml -checkonly.
            #    Some PlantUML versions return exit 0 even on parse warnings,
            #    so we also grep stdout/stderr for known error markers.
            output=$(plantuml -checkonly "$f" 2>&1)
            rc=$?
            if [ $rc -ne 0 ] || echo "$output" | grep -qiE '(syntax error|error: )' ; then
              echo "  SYNTAX FAIL"
              echo "$output" | sed 's/^/    /'
              fail=1
              continue
            fi

            # 2. Content check: file must contain at least one diagram
            #    declaration or arrow between @startuml/@enduml. Catches the
            #    v0.9.15 class of bug (every line a comment; PlantUML renders
            #    nothing).
            decls=$(grep -cE '^[[:space:]]*(class|abstract|interface|enum|actor|usecase|boundary|entity|control|rectangle|package|database|note|state|participant|component|object|frame|cloud|node|artifact)[[:space:]]+' "$f" 2>/dev/null || echo 0)
            arrows=$(grep -cE '(\-+\>|\<\-+|\.\.\>|\<\.\.|\-\-\|\>|\-\->|\<\-\-|--o |--\* )' "$f" 2>/dev/null || echo 0)
            content=$((decls + arrows))
            if [ "$content" -eq 0 ]; then
              echo "  CONTENT FAIL: file has no diagram declarations or arrows."
              echo "    Add at least one element (class/actor/usecase/...) or"
              echo "    arrow between @startuml and @enduml — or remove this"
              echo "    file. Empty-but-syntactically-valid diagrams render"
              echo "    nothing in PlantUML previewers."
              fail=1
              continue
            fi

            echo "  OK ($decls declarations, $arrows arrows)"
          done

          echo ""
          if [ $fail -ne 0 ]; then
            echo "PlantUML validation FAILED. See errors above."
            exit 1
          fi
          echo "✓ All PlantUML files validated."

  smoke-test-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make installer executable
        run: chmod +x ./iconix-init

      - name: Install into a scratch project
        run: |
          mkdir -p /tmp/test-project
          cd /tmp/test-project
          "${GITHUB_WORKSPACE}/iconix-init" \
            --source "${GITHUB_WORKSPACE}" \
            --prefix CI \
            --language python

      - name: Verify installation
        run: |
          cd /tmp/test-project
          test -d .claude/agents || { echo "agents dir missing"; exit 1; }
          test -d .claude/commands || { echo "commands dir missing"; exit 1; }
          test -f iconix.config.yaml || { echo "config missing"; exit 1; }
          grep -q 'prefix: "CI"' iconix.config.yaml || { echo "prefix not patched"; exit 1; }
          grep -q 'language: "python"' iconix.config.yaml || { echo "language not patched"; exit 1; }
          # Count agents (v0.2.0 baseline = 10)
          agent_count=$(ls .claude/agents/ | wc -l)
          if [ "$agent_count" -lt 10 ]; then
            echo "Expected at least 10 agents, found $agent_count"
            exit 1
          fi
          # v0.3.0: knowledge_graph section must be present in config
          grep -q 'knowledge_graph:' iconix.config.yaml || { echo "knowledge_graph section missing"; exit 1; }
          # v0.3.0: knowledge graph must be disabled by default (portability)
          grep -q 'enabled: false' iconix.config.yaml || { echo "knowledge_graph should default to enabled: false"; exit 1; }
          # v0.3.0: graphify command must be installed
          test -f .claude/commands/iconix-graphify.md || { echo "iconix-graphify command missing"; exit 1; }
          # v0.3.0: graphify setup guide must be copied to templates
          test -f docs/iconix/templates/graphify-setup.md || { echo "graphify-setup.md missing"; exit 1; }
          # v0.3.0: migration agent must mention graphify
          grep -q -i 'graphify' .claude/agents/iconix-migration.md || { echo "migration agent missing graphify integration"; exit 1; }
          # v0.8.9: intake templates must be copied to templates
          test -f docs/iconix/templates/intake-transcript-template.md || { echo "intake-transcript-template.md missing"; exit 1; }
          test -f docs/iconix/templates/intake-brd-template.md || { echo "intake-brd-template.md missing"; exit 1; }
          test -f docs/iconix/templates/intake-email-template.md || { echo "intake-email-template.md missing"; exit 1; }
          test -f docs/iconix/templates/intake-feature-request-template.md || { echo "intake-feature-request-template.md missing"; exit 1; }
          # v0.9.4: bug report template (optional structured input for /iconix-bug)
          test -f docs/iconix/templates/bug-report-template.md || { echo "bug-report-template.md missing"; exit 1; }
          # v0.9.5: git integration — branch + commit conventions and the generic validator script
          test -f docs/iconix/templates/git-integration/branch-conventions.md || { echo "branch-conventions.md missing"; exit 1; }
          test -f docs/iconix/templates/git-integration/commit-conventions.md || { echo "commit-conventions.md missing"; exit 1; }
          test -f .ci/validate-traceability.sh || { echo ".ci/validate-traceability.sh missing"; exit 1; }
          test -x .ci/validate-traceability.sh || { echo ".ci/validate-traceability.sh not executable"; exit 1; }
          # v0.9.6: concurrent-touch detection template
          test -f docs/iconix/templates/concurrent-touch-template.md || { echo "concurrent-touch-template.md missing"; exit 1; }
          # v0.9.6: concurrent_check section present in seeded config
          grep -q 'concurrent_check:' iconix.config.yaml || { echo "concurrent_check section missing in iconix.config.yaml"; exit 1; }
          # v0.9.7: metrics templates and glossary
          test -f docs/iconix/templates/metrics-snapshot-template.md || { echo "metrics-snapshot-template.md missing"; exit 1; }
          test -f docs/iconix/templates/metrics-schema.json || { echo "metrics-schema.json missing"; exit 1; }
          test -f docs/iconix/metrics-glossary.md || { echo "metrics-glossary.md missing"; exit 1; }
          test -d metrics || { echo "metrics/ folder missing"; exit 1; }
          # v0.9.7: metrics section present in seeded config
          grep -q 'metrics:' iconix.config.yaml || { echo "metrics section missing in iconix.config.yaml"; exit 1; }
          # v0.9.8: phase 9 cycle template + folder + config section
          test -f docs/iconix/templates/phase9-cycle-template.md || { echo "phase9-cycle-template.md missing"; exit 1; }
          test -d phase9-cycles || { echo "phase9-cycles/ folder missing"; exit 1; }
          grep -q 'phase9:' iconix.config.yaml || { echo "phase9 section missing in iconix.config.yaml"; exit 1; }
          # v0.9.9: kit_version field + upgrade-report template + upgrades/ folder
          grep -q 'kit_version:' iconix.config.yaml || { echo "kit_version field missing in iconix.config.yaml"; exit 1; }
          test -f docs/iconix/templates/upgrade-report-template.md || { echo "upgrade-report-template.md missing"; exit 1; }
          test -d upgrades || { echo "upgrades/ folder missing"; exit 1; }
          # v0.9.10: initial domain model template (forcing-function fix)
          test -f docs/iconix/templates/domain-model-initial-template.puml || { echo "domain-model-initial-template.puml missing"; exit 1; }
          # v0.9.14: Architect templates (forcing-function fix — M2A-#1)
          test -f docs/iconix/templates/container-mapping-template.md || { echo "container-mapping-template.md missing"; exit 1; }
          test -f docs/iconix/templates/nfr-annotations-template.md || { echo "nfr-annotations-template.md missing"; exit 1; }
          test -f docs/iconix/templates/nfr-catalog-template.md || { echo "nfr-catalog-template.md missing"; exit 1; }
          test -f docs/iconix/templates/architecture-package-map-template.md || { echo "architecture-package-map-template.md missing"; exit 1; }
          test -f docs/iconix/templates/integration-surface-template.md || { echo "integration-surface-template.md missing"; exit 1; }
          # v0.9.18: milestone-report template (forcing-function fix — M2A-R-#10)
          test -f docs/iconix/templates/milestone-report-template.md || { echo "milestone-report-template.md missing"; exit 1; }
          # v0.9.19: Developer templates (forcing-function fixes — M3D-R-#7, #8)
          test -f docs/iconix/templates/class-model-template.puml || { echo "class-model-template.puml missing"; exit 1; }
          test -f docs/iconix/templates/cdr-report-template.md || { echo "cdr-report-template.md missing"; exit 1; }
          # v0.9.0: use case package overview template + folder
          test -d use-case-packages || { echo "use-case-packages/ folder missing"; exit 1; }
          test -f docs/iconix/templates/use-case-diagram-template.puml || { echo "use-case-diagram-template.puml missing"; exit 1; }
          echo "OK — installation validated"
