name: Validate ICONIX Kit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check agent file frontmatter
        run: |
          set -e
          fail=0
          for f in agents/*.md; do
            if ! head -1 "$f" | grep -q '^---$'; then
              echo "ERROR: $f is missing YAML frontmatter opening"
              fail=1
            fi
            if ! head -20 "$f" | grep -q '^name:'; then
              echo "ERROR: $f is missing 'name:' in frontmatter"
              fail=1
            fi
            if ! head -20 "$f" | grep -q '^description:'; then
              echo "ERROR: $f is missing 'description:' in frontmatter"
              fail=1
            fi
          done
          exit $fail

      - name: Check command file frontmatter
        run: |
          set -e
          fail=0
          for f in commands/*.md; do
            if ! head -1 "$f" | grep -q '^---$'; then
              echo "ERROR: $f is missing YAML frontmatter opening"
              fail=1
            fi
            if ! head -10 "$f" | grep -q '^description:'; then
              echo "ERROR: $f is missing 'description:' in frontmatter"
              fail=1
            fi
          done
          exit $fail

      - name: Ensure agent names are unique
        run: |
          names=$(grep -h '^name:' agents/*.md | sort)
          dupes=$(echo "$names" | uniq -d)
          if [ -n "$dupes" ]; then
            echo "ERROR: Duplicate agent names found:"
            echo "$dupes"
            exit 1
          fi

      - name: Agent token budget
        # Per CLAUDE.md `## Agent token budget`: every agent should stay under the
        # 10K soft ceiling. Use chars/4 as a portable rough estimate (no Python /
        # tiktoken dependency in CI). Hard-fails at the 12K ceiling (20% headroom
        # over soft); warns between 10K and 12K. Drift past the soft ceiling
        # historically went unnoticed (structural grew from 7.1K to 9.75K silently
        # between v1.0.40 and v1.0.58) — this step makes it visible on every PR.
        run: |
          set -e
          soft=10000
          hard=12000
          fail=0
          printf '%-45s %10s %s\n' "Agent" "Tokens" "Status"
          printf '%-45s %10s %s\n' "---------------------------------------------" "----------" "----------"
          for f in agents/*.md; do
            chars=$(wc -c < "$f")
            tokens=$((chars / 4))
            name=$(basename "$f")
            if [ "$tokens" -gt "$hard" ]; then
              printf '%-45s %10d %s\n' "$name" "$tokens" "FAIL (> ${hard})"
              fail=1
            elif [ "$tokens" -gt "$soft" ]; then
              printf '%-45s %10d %s\n' "$name" "$tokens" "WARN (> ${soft})"
            else
              printf '%-45s %10d %s\n' "$name" "$tokens" "ok"
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "ERROR: one or more agents exceed the hard token ceiling (${hard})."
            echo "Refer to CLAUDE.md '## Agent token budget' for extraction technique."
            exit 1
          fi

      - name: Agent tool consistency check
        # Tier 1 of "per-agent dry-run tests" — static analysis of agent prompt body
        # vs declared tools. Catches the class of bug where the body instructs file
        # writes (Produce / Save / Create / Write `path.md`) but the tools list omits
        # Write or Edit. Past examples: v1.0.58 (Reviewer Write missing despite body
        # producing reviews/REVIEW-*.md) and v1.0.62 (Metrics Write missing despite
        # body writing metrics/snapshot-*.md). Both caught by audit, not CI; this step
        # closes the gap so a future regression fails the PR.
        #
        # Heuristic: scan each agent for file-action verbs paired with backticked paths
        # ending in .md / .puml / .json / .yaml / .sh, plus the canonical
        # "# Artifacts you produce" section header. If any signal fires and the tools
        # list lacks both Write and Edit, fail. Over-declared tools (signal=0 but
        # Write declared) are not flagged — that's acceptable noise.
        #
        # Advisory checks (warn, do not fail): description fields with embedded
        # version tags like "v0.9.7+" age badly — frontmatter descriptions should be
        # evergreen.
        run: |
          set -e
          fail=0
          warn=0
          printf '%-45s %8s %12s %s\n' "Agent" "Signal" "Write/Edit" "Status"
          printf '%-45s %8s %12s %s\n' "---------------------------------------------" "--------" "------------" "----------"
          for f in agents/*.md; do
            name=$(basename "$f")
            tools=$(grep -m1 '^tools:' "$f" | sed 's/tools://;s/,/ /g')

            # `grep -c` exits 1 when match count is 0, which would abort the loop
            # under `set -e`. The `|| true` swallows that exit code; grep -c still
            # prints "0" to stdout, so the variable captures the count correctly.
            verb_writes=$(grep -cE '^[0-9.]*\.? *[-*]? *(\*\*)?(Produce|Save|Create|Write|Refine|Append|Update|Aggregate|Emit) [a-zA-Z, `]*`[a-z][^`]+\.(md|puml|json|yaml|yml|sh)`' "$f" || true)
            has_output_section=$(grep -cE '^# (Artifacts you produce|What you produce|What you write|Artifacts produced)' "$f" || true)
            signal=$((verb_writes + has_output_section))

            has_we=$(echo " $tools " | grep -cE ' Write | Edit ' || true)

            status="ok"
            if [ "$signal" -gt 0 ] && [ "$has_we" -eq 0 ]; then
              status="FAIL — body implies writes but Write/Edit not declared"
              fail=1
            fi

            printf '%-45s %8d %12d %s\n' "$name" "$signal" "$has_we" "$status"
          done

          echo ""
          for f in agents/*.md; do
            desc=$(grep -m1 '^description:' "$f")
            if echo "$desc" | grep -qE 'v[0-9]+\.[0-9]+(\.[0-9]+)?\+'; then
              tag=$(echo "$desc" | grep -oE 'v[0-9.]+\+' | head -1 || true)
              echo "WARN: $(basename $f) — description contains version tag '$tag' (should be evergreen)"
              warn=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "ERROR: one or more agents have tool-list vs body inconsistencies."
            echo "Refer to CHANGELOG v1.0.58 (Reviewer) and v1.0.62 (Metrics) for past examples."
            exit 1
          fi
          if [ "$warn" -ne 0 ]; then
            echo ""
            echo "(advisory only — version tags don't fail the build)"
          fi

  validate-plantuml:
    # Catches PlantUML rendering bugs that previously slipped past prompt review
    # and only surfaced when a human opened the file in a previewer:
    #   - v0.9.13: bare <...> in arrow labels / unclosed <PREFIX> tags in notes
    #   - v0.9.15: "empty" diagram (only comments between @startuml/@enduml)
    # See CHANGELOG entries for v0.9.13 and v0.9.15.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PlantUML
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y plantuml

      - name: Validate PlantUML files (syntax + content)
        run: |
          set +e   # collect all failures, don't stop on first
          fail=0
          # Find every .puml in the repo (templates/, examples/, root, etc.)
          # Skip .git internals and anything in node_modules if present.
          files=$(find . -name '*.puml' -not -path './.git/*' -not -path './node_modules/*' | sort)

          if [ -z "$files" ]; then
            echo "No .puml files found — nothing to validate."
            exit 0
          fi

          echo "Validating $(echo "$files" | wc -l | tr -d ' ') .puml file(s)..."
          echo ""

          for f in $files; do
            echo "── $f"

            # 1. Syntax check via plantuml -checkonly.
            #    Some PlantUML versions return exit 0 even on parse warnings,
            #    so we also grep stdout/stderr for known error markers.
            output=$(plantuml -checkonly "$f" 2>&1)
            rc=$?
            if [ $rc -ne 0 ] || echo "$output" | grep -qiE '(syntax error|error: )' ; then
              echo "  SYNTAX FAIL"
              echo "$output" | sed 's/^/    /'
              fail=1
              continue
            fi

            # 2. Content check: file must contain at least one diagram
            #    declaration or arrow between @startuml/@enduml. Catches the
            #    v0.9.15 class of bug (every line a comment; PlantUML renders
            #    nothing).
            decls=$(grep -cE '^[[:space:]]*(class|abstract|interface|enum|actor|usecase|boundary|entity|control|rectangle|package|database|note|state|participant|component|object|frame|cloud|node|artifact)[[:space:]]+' "$f" 2>/dev/null || echo 0)
            arrows=$(grep -cE '(\-+\>|\<\-+|\.\.\>|\<\.\.|\-\-\|\>|\-\->|\<\-\-|--o |--\* )' "$f" 2>/dev/null || echo 0)
            content=$((decls + arrows))
            if [ "$content" -eq 0 ]; then
              echo "  CONTENT FAIL: file has no diagram declarations or arrows."
              echo "    Add at least one element (class/actor/usecase/...) or"
              echo "    arrow between @startuml and @enduml — or remove this"
              echo "    file. Empty-but-syntactically-valid diagrams render"
              echo "    nothing in PlantUML previewers."
              fail=1
              continue
            fi

            echo "  OK ($decls declarations, $arrows arrows)"
          done

          echo ""
          if [ $fail -ne 0 ]; then
            echo "PlantUML validation FAILED. See errors above."
            exit 1
          fi
          echo "✓ All PlantUML files validated."

  smoke-test-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make installer executable
        run: chmod +x ./iconix-init

      - name: Install into a scratch project
        run: |
          mkdir -p /tmp/test-project
          cd /tmp/test-project
          "${GITHUB_WORKSPACE}/iconix-init" \
            --source "${GITHUB_WORKSPACE}" \
            --prefix CI \
            --language python

      - name: Verify installation
        run: |
          cd /tmp/test-project
          test -d .claude/agents || { echo "agents dir missing"; exit 1; }
          test -d .claude/commands || { echo "commands dir missing"; exit 1; }
          test -f iconix.config.yaml || { echo "config missing"; exit 1; }
          grep -q 'prefix: "CI"' iconix.config.yaml || { echo "prefix not patched"; exit 1; }
          grep -q 'language: "python"' iconix.config.yaml || { echo "language not patched"; exit 1; }
          # Count agents (v0.2.0 baseline = 10)
          agent_count=$(ls .claude/agents/ | wc -l)
          if [ "$agent_count" -lt 10 ]; then
            echo "Expected at least 10 agents, found $agent_count"
            exit 1
          fi
          # v0.3.0: knowledge_graph section must be present in config
          grep -q 'knowledge_graph:' iconix.config.yaml || { echo "knowledge_graph section missing"; exit 1; }
          # v0.3.0: knowledge graph must be disabled by default (portability)
          grep -q 'enabled: false' iconix.config.yaml || { echo "knowledge_graph should default to enabled: false"; exit 1; }
          # v0.3.0: graphify command must be installed
          test -f .claude/commands/iconix-graphify.md || { echo "iconix-graphify command missing"; exit 1; }
          # v0.3.0: graphify setup guide must be copied to templates
          test -f docs/iconix/templates/graphify-setup.md || { echo "graphify-setup.md missing"; exit 1; }
          # v0.3.0: migration agent must mention graphify
          grep -q -i 'graphify' .claude/agents/iconix-migration.md || { echo "migration agent missing graphify integration"; exit 1; }
          # v0.8.9: intake templates must be copied to templates
          test -f docs/iconix/templates/intake-transcript-template.md || { echo "intake-transcript-template.md missing"; exit 1; }
          test -f docs/iconix/templates/intake-brd-template.md || { echo "intake-brd-template.md missing"; exit 1; }
          test -f docs/iconix/templates/intake-email-template.md || { echo "intake-email-template.md missing"; exit 1; }
          test -f docs/iconix/templates/intake-feature-request-template.md || { echo "intake-feature-request-template.md missing"; exit 1; }
          # v0.9.4: bug report template (optional structured input for /iconix-bug)
          test -f docs/iconix/templates/bug-report-template.md || { echo "bug-report-template.md missing"; exit 1; }
          # v1.0.47: migration agent split — 3 sub-agents + schema detection reference file
          test -f .claude/agents/iconix-migration-infra.md || { echo "iconix-migration-infra.md missing"; exit 1; }
          test -f .claude/agents/iconix-migration-structural.md || { echo "iconix-migration-structural.md missing"; exit 1; }
          test -f .claude/agents/iconix-migration-semantic.md || { echo "iconix-migration-semantic.md missing"; exit 1; }
          test -f docs/iconix/templates/migration-schema-detection-reference.md || { echo "migration-schema-detection-reference.md missing"; exit 1; }
          test -f docs/iconix/templates/migration-stack-patterns-reference.md || { echo "migration-stack-patterns-reference.md missing"; exit 1; }
          # v0.9.5: git integration — branch + commit conventions and the generic validator script
          test -f docs/iconix/templates/git-integration/branch-conventions.md || { echo "branch-conventions.md missing"; exit 1; }
          test -f docs/iconix/templates/git-integration/commit-conventions.md || { echo "commit-conventions.md missing"; exit 1; }
          test -f .ci/validate-traceability.sh || { echo ".ci/validate-traceability.sh missing"; exit 1; }
          test -x .ci/validate-traceability.sh || { echo ".ci/validate-traceability.sh not executable"; exit 1; }
          # v0.9.6: concurrent-touch detection template
          test -f docs/iconix/templates/concurrent-touch-template.md || { echo "concurrent-touch-template.md missing"; exit 1; }
          # v0.9.6: concurrent_check section present in seeded config
          grep -q 'concurrent_check:' iconix.config.yaml || { echo "concurrent_check section missing in iconix.config.yaml"; exit 1; }
          # v0.9.7: metrics templates and glossary
          test -f docs/iconix/templates/metrics-snapshot-template.md || { echo "metrics-snapshot-template.md missing"; exit 1; }
          test -f docs/iconix/templates/metrics-schema.json || { echo "metrics-schema.json missing"; exit 1; }
          test -f docs/iconix/metrics-glossary.md || { echo "metrics-glossary.md missing"; exit 1; }
          test -d metrics || { echo "metrics/ folder missing"; exit 1; }
          # v0.9.7: metrics section present in seeded config
          grep -q 'metrics:' iconix.config.yaml || { echo "metrics section missing in iconix.config.yaml"; exit 1; }
          # v0.9.8: phase 9 cycle template + folder + config section
          test -f docs/iconix/templates/phase9-cycle-template.md || { echo "phase9-cycle-template.md missing"; exit 1; }
          test -d phase9-cycles || { echo "phase9-cycles/ folder missing"; exit 1; }
          grep -q 'phase9:' iconix.config.yaml || { echo "phase9 section missing in iconix.config.yaml"; exit 1; }
          # v0.9.9: kit_version field + upgrade-report template + upgrades/ folder
          grep -q 'kit_version:' iconix.config.yaml || { echo "kit_version field missing in iconix.config.yaml"; exit 1; }
          test -f docs/iconix/templates/upgrade-report-template.md || { echo "upgrade-report-template.md missing"; exit 1; }
          test -d upgrades || { echo "upgrades/ folder missing"; exit 1; }
          # v0.9.10: initial domain model template (forcing-function fix)
          test -f docs/iconix/templates/domain-model-initial-template.puml || { echo "domain-model-initial-template.puml missing"; exit 1; }
          # v0.9.14: Architect templates (forcing-function fix — M2A-#1)
          test -f docs/iconix/templates/container-mapping-template.md || { echo "container-mapping-template.md missing"; exit 1; }
          test -f docs/iconix/templates/nfr-annotations-template.md || { echo "nfr-annotations-template.md missing"; exit 1; }
          test -f docs/iconix/templates/nfr-catalog-template.md || { echo "nfr-catalog-template.md missing"; exit 1; }
          test -f docs/iconix/templates/architecture-package-map-template.md || { echo "architecture-package-map-template.md missing"; exit 1; }
          test -f docs/iconix/templates/integration-surface-template.md || { echo "integration-surface-template.md missing"; exit 1; }
          # v0.9.18: milestone-report template (forcing-function fix — M2A-R-#10)
          test -f docs/iconix/templates/milestone-report-template.md || { echo "milestone-report-template.md missing"; exit 1; }
          # v0.9.19: Developer templates (forcing-function fixes — M3D-R-#7, #8)
          test -f docs/iconix/templates/class-model-template.puml || { echo "class-model-template.puml missing"; exit 1; }
          test -f docs/iconix/templates/cdr-report-template.md || { echo "cdr-report-template.md missing"; exit 1; }
          # v0.9.20: Tester templates (forcing-function fixes — M3T-R-#6, #7)
          test -f docs/iconix/templates/edge-case-report-template.md || { echo "edge-case-report-template.md missing"; exit 1; }
          test -f docs/iconix/templates/test-matrix-template.md || { echo "test-matrix-template.md missing"; exit 1; }
          # v0.9.0: use case package overview template + folder
          test -d use-case-packages || { echo "use-case-packages/ folder missing"; exit 1; }
          test -f docs/iconix/templates/use-case-diagram-template.puml || { echo "use-case-diagram-template.puml missing"; exit 1; }
          echo "OK — installation validated"

  smoke-test-installer-windows:
    # Verifies iconix-init.ps1 on Windows PowerShell 5.1 — the actual shell
    # Windows users run. PowerShell Core (pwsh) differs in behaviour and is
    # not a valid proxy for this test.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install into a scratch project
        shell: powershell
        run: |
          $target = "$env:RUNNER_TEMP\iconix-test"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Set-Location $target
          & "$env:GITHUB_WORKSPACE\iconix-init.ps1" -Source $env:GITHUB_WORKSPACE -Prefix CI -Language python

      - name: Verify installation
        shell: powershell
        run: |
          Set-Location "$env:RUNNER_TEMP\iconix-test"

          function Assert-Dir($p)  { if (-not (Test-Path $p -PathType Container)) { Write-Error "$p missing"; exit 1 } }
          function Assert-File($p) { if (-not (Test-Path $p -PathType Leaf))      { Write-Error "$p missing"; exit 1 } }
          function Assert-Content($f, $pat, $msg) {
            if (-not (Select-String -Path $f -Pattern $pat -Quiet)) { Write-Error $msg; exit 1 }
          }

          Assert-Dir  ".claude\agents"
          Assert-Dir  ".claude\commands"
          Assert-File "iconix.config.yaml"
          Assert-Content "iconix.config.yaml" 'prefix: "CI"'       "prefix not patched"
          Assert-Content "iconix.config.yaml" 'language: "python"' "language not patched"

          $agentCount = (Get-ChildItem ".claude\agents" -Filter "*.md").Count
          if ($agentCount -lt 10) { Write-Error "Expected at least 10 agents, found $agentCount"; exit 1 }

          Assert-Content "iconix.config.yaml" "knowledge_graph:"  "knowledge_graph section missing"
          Assert-Content "iconix.config.yaml" "enabled: false"    "knowledge_graph should default to enabled: false"
          Assert-File ".claude\commands\iconix-graphify.md"
          Assert-File "docs\iconix\templates\graphify-setup.md"
          Assert-Content ".claude\agents\iconix-migration.md" "graphify" "migration agent missing graphify integration"

          Assert-File "docs\iconix\templates\intake-transcript-template.md"
          Assert-File "docs\iconix\templates\intake-brd-template.md"
          Assert-File "docs\iconix\templates\intake-email-template.md"
          Assert-File "docs\iconix\templates\intake-feature-request-template.md"
          Assert-File "docs\iconix\templates\bug-report-template.md"

          # v1.0.47: migration sub-agents + schema detection reference file
          Assert-File ".claude\agents\iconix-migration-infra.md"
          Assert-File ".claude\agents\iconix-migration-structural.md"
          Assert-File ".claude\agents\iconix-migration-semantic.md"
          Assert-File "docs\iconix\templates\migration-schema-detection-reference.md"
          Assert-File "docs\iconix\templates\migration-stack-patterns-reference.md"

          Assert-File "docs\iconix\templates\git-integration\branch-conventions.md"
          Assert-File "docs\iconix\templates\git-integration\commit-conventions.md"
          Assert-File ".ci\validate-traceability.sh"

          Assert-Content "iconix.config.yaml" "concurrent_check:" "concurrent_check section missing"

          Assert-File "docs\iconix\templates\metrics-snapshot-template.md"
          Assert-File "docs\iconix\templates\metrics-schema.json"
          Assert-File "docs\iconix\metrics-glossary.md"
          Assert-Dir  "metrics"
          Assert-Content "iconix.config.yaml" "metrics:" "metrics section missing"

          Assert-File "docs\iconix\templates\phase9-cycle-template.md"
          Assert-Dir  "phase9-cycles"
          Assert-Content "iconix.config.yaml" "phase9:" "phase9 section missing"

          Assert-Content "iconix.config.yaml" "kit_version:" "kit_version field missing"
          Assert-File "docs\iconix\templates\upgrade-report-template.md"
          Assert-Dir  "upgrades"

          Assert-File "docs\iconix\templates\domain-model-initial-template.puml"
          Assert-File "docs\iconix\templates\container-mapping-template.md"
          Assert-File "docs\iconix\templates\nfr-annotations-template.md"
          Assert-File "docs\iconix\templates\nfr-catalog-template.md"
          Assert-File "docs\iconix\templates\architecture-package-map-template.md"
          Assert-File "docs\iconix\templates\integration-surface-template.md"
          Assert-File "docs\iconix\templates\milestone-report-template.md"
          Assert-File "docs\iconix\templates\class-model-template.puml"
          Assert-File "docs\iconix\templates\cdr-report-template.md"
          Assert-File "docs\iconix\templates\edge-case-report-template.md"
          Assert-File "docs\iconix\templates\test-matrix-template.md"
          Assert-Dir  "use-case-packages"
          Assert-File "docs\iconix\templates\use-case-diagram-template.puml"

          Write-Host "OK - installation validated"
